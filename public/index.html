<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>note-scanner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page__header">
        <h1>note-scanner</h1>
        <p class="page__lead">
          Turn photos of whiteboards, slides, and handwritten notes into structured text.
        </p>
      </header>

      <section
        id="dropzone"
        class="dropzone"
        aria-labelledby="dropzone-heading"
      >
        <h2 id="dropzone-heading" class="dropzone__heading">Drop images here</h2>
        <p class="dropzone__hint">JPEG, PNG, or HEIC — up to 25 per run.</p>
        <label class="button">
          Choose images
          <input
            id="file-input"
            class="visually-hidden"
            type="file"
            multiple
            accept="image/jpeg,image/png,image/heic,image/heif,.jpg,.jpeg,.png,.heic,.heif"
          />
        </label>
      </section>

      <section class="selection" aria-labelledby="selection-heading">
        <div class="selection__bar">
          <h2 id="selection-heading" class="selection__heading">
            Selected
            <span id="counter" class="counter" aria-live="polite">0 / 25</span>
          </h2>
          <button id="clear" class="button button--quiet" type="button" disabled>
            Clear all
          </button>
        </div>

        <ul id="thumbnails" class="thumbnails"></ul>
        <p id="empty-state" class="empty-state">No images selected yet.</p>

        <div id="errors" class="errors" role="status" aria-live="polite"></div>
      </section>

      <section class="actions">
        <button id="convert" class="button button--primary" type="button" disabled>
          Convert
        </button>
        <button id="stop" class="button" type="button" hidden>Stop</button>
        <button id="retry" class="button" type="button" hidden>Retry failed images</button>
        <span id="progress" class="progress" aria-live="polite"></span>
      </section>

      <div id="status" class="status">
        <!-- Only the message is announced; the counter ticks every second and
             would otherwise be read out each time. -->
        <span id="status-message" role="status" aria-live="polite"></span>
        <span id="status-elapsed" class="status__elapsed" aria-hidden="true"></span>
      </div>

      <section id="output" class="output" aria-labelledby="output-heading" hidden>
        <div class="output__bar">
          <h2 id="output-heading">Markdown</h2>
          <div class="output__controls">
            <label id="view-field" class="field" hidden>
              View
              <select id="view" class="select">
                <option value="merged">Merged</option>
                <option value="pages">Pages</option>
              </select>
            </label>
            <label class="field">
              Template
              <select id="template" class="select">
                <option value="lecture">Lecture notes</option>
                <option value="practice">Practice questions</option>
                <option value="freeform">Freeform</option>
              </select>
            </label>
            <label class="field">
              Formulas
              <select id="flavour" class="select">
                <option value="latex">LaTeX ($$)</option>
                <option value="unicode">Unicode (∑ ⊆)</option>
                <option value="plain">Plain text</option>
                <option value="code">Code spans</option>
              </select>
            </label>
            <button id="copy" class="button" type="button">Copy</button>
            <button id="download" class="button" type="button">Download .md</button>
          </div>
        </div>
        <pre id="output-markdown" class="output__markdown"></pre>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
